services:
  paperless-ai:
    image: clusterzx/paperless-ai:latest
    container_name: ${CONTAINER_NAME:-paperless-ai}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://localhost:8000}
      - RAG_SERVICE_ENABLED=${RAG_SERVICE_ENABLED:-true}
    ports:
      - "${EXTERNAL_PORT:-3000}:3000"
    volumes:
      - ${DOCKER_DATA_PATH:-.}/data:/app/data
