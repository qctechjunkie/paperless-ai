services:
  paperless-ai:
    image: admonstrator/paperless-ai-next:latest-full
    container_name: ${CONTAINER_NAME:-paperless-ai}
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env
    environment:
      - PAPERLESS_AI_INITIAL_SETUP=yes
      # Required to access the setup wizard from a remote browser.
      # Remove this line after completing the initial setup.
      - ALLOW_REMOTE_SETUP=yes
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PAPERLESS_AI_PORT=${PAPERLESS_AI_PORT:-3000}
      - RAG_SERVICE_ENABLED=${RAG_SERVICE_ENABLED:-true}
    ports:
      - "${PAPERLESS_AI_PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
