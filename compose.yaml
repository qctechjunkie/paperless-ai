services:
  paperless-ai:
    image: clusterzx/paperless-ai
    container_name: ${CONTAINER_NAME:-paperless-ai}
    network_mode: bridge
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PAPERLESS_AI_PORT=${PAPERLESS_AI_PORT:-3000}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://localhost:8000}
      - RAG_SERVICE_ENABLED=${RAG_SERVICE_ENABLED:-true}
    ports:
      - "${EXTERNAL_PORT:-3000}:${PAPERLESS_AI_PORT:-3000}"
    volumes:
      - ${DATA_PATH:-./data}:/app/data
